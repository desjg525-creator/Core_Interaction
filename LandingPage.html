
<!DOCTYPE html>

  <style>
    @font-face {
      font-family: 'Gothicus';
      src: url('Gothicus.ttf') format('truetype');
    }

    body {
      margin: 0;
      background-color: black;
      color: #e8d99d;
      font-family: 'Gothicus', serif;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    h1 {

      margin: 0;
    }

      color: #b5b5a5;
      font-size: 14px;
      letter-spacing: 3px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }

    .project {
      border: 1px solid #78643c;
      padding: 35px 20px;
      min-height: 120px;
      text-align: center;
      background-color: #111;
      text-decoration: none;
      color: #e8d99d;
    }

    .project:hover {
      background-color: #302019;
    }

    .project h3 {
      font-size: 30px;
      margin: 10px 0;
    }

    .project p {
      font-size: 12px;
      letter-spacing: 2px;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #8e3329;
      font-size: 25px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 43px;
      }

      .projects {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
